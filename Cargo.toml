[workspace]
resolver = "2"
members = [
    "crates/robstride-protocol",
    "crates/robstride",
    "crates/robstride-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Takara Kasai <takara.kasai@gmail.com>"]
repository = "https://github.com/kasai-takara/robstride-rs"
description = "Rust driver for Robstride CAN servo motors (RS-00 / RS-01 / RS-02 / RS-03 / RS-04 / RS-05 / RS-06 / Edulite series)"

[workspace.dependencies]
robstride-protocol = { path = "crates/robstride-protocol", version = "0.1.0" }
robstride-driver = { path = "crates/robstride", version = "0.1.0" }
socketcan = "3.3"
embedded-can = "0.4"
thiserror = "2"
log = "0.4"
